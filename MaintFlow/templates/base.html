<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaintFlow</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('dashboard') }}">Maint<span>Flow</span></a>
{% if session.get('user_id') %}<nav><a href="{{ url_for('dashboard') }}">Painel</a><a href="{{ url_for('equipment') }}">Equipamentos</a><a href="{{ url_for('orders') }}">Ordens de serviço</a></nav><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">Sair · {{ session.username }}</button></form>{% endif %}</header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<p class="message {{ category }}" role="alert">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>MaintFlow · Gestão local de manutenção</footer></body></html>
