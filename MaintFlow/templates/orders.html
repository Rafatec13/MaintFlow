{% extends 'base.html' %}{% block content %}<p class="eyebrow">ACOMPANHAMENTO</p><h1>Ordens de serviço</h1><section><h2>Nova ordem</h2>{% if items %}<form method="post" class="grid-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Equipamento<select name="equipment_id" required><option value="">Selecione</option>{% for item in items %}<option value="{{ item.id }}" {% if request.form.get('equipment_id') == item.id|string %}selected{% endif %}>{{ item.tag }} · {{ item.name }}</option>{% endfor %}</select></label><label>Prioridade<select name="priority" required>{% for p in ['Baixa','Média','Alta'] %}<option {% if request.form.get('priority','Média') == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><label class="wide">Descrição do serviço<textarea name="description" required maxlength="2000">{{ request.form.get('description','') }}</textarea></label><div><button>Abrir ordem</button></div></form>{% else %}<p>Cadastre um <a href="{{ url_for('equipment') }}">equipamento</a> antes de abrir uma ordem.</p>{% endif %}</section><section><div class="heading"><h2>Ordens registradas</h2><form method="get"><label>Filtrar status<select name="status" onchange="this.form.submit()"><option value="">Todos</option>{% for s in ['Aberta','Em andamento','Concluída'] %}<option {% if selected == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><noscript><button>Filtrar</button></noscript></form></div>{% include '_orders.html' %}</section>{% endblock %}
