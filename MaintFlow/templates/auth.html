{% extends 'base.html' %}{% block content %}<section class="auth"><p class="eyebrow">GESTÃO DE MANUTENÇÃO</p><h1>{{ 'Configure seu acesso' if setup else 'Bem-vindo ao MaintFlow' }}</h1><p>{{ 'Crie o usuário que será usado nesta instalação local.' if setup else 'Entre para acompanhar equipamentos e serviços.' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Usuário<input name="username" required minlength="3" maxlength="60" autocomplete="username" value="{{ request.form.get('username','') }}"></label><label>Senha<input type="password" name="password" required {% if setup %}minlength="8"{% endif %} maxlength="200" autocomplete="{{ 'new-password' if setup else 'current-password' }}"></label><button>{{ 'Criar usuário' if setup else 'Entrar' }}</button></form></section>{% endblock %}
